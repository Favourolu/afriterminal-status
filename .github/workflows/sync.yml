name: Sync Dashboard

on:
  schedule:
    # Runs every 15 minutes — picks up scraper runs within one refresh cycle
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout status repo
        uses: actions/checkout@v4

      - name: Fetch dashboard from main repo
        run: |
          curl -sSf \
            "https://raw.githubusercontent.com/Favourolu/afriterminal/main/ops_dashboard_index.html" \
            -o index_new.html

      - name: Check for changes
        id: diff
        run: |
          if diff -q index.html index_new.html > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated dashboard
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp index_new.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync dashboard from main repo [skip ci]"
          git push
